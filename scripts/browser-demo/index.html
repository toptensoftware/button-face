<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>button-face browser demo</title>
<style>
    body { margin: 0; padding: 12px; background: #9e9e9e; font: 14px/1.2 sans-serif; color: black; }
    /* Fixed line-height (inherited as a ratio) so page layout matches across
       browsers - Firefox's default "normal" line-height is ~1px taller. */
    h1 { font-size: 18px; margin: 0 0 4px; }
    h2 { font-size: 14px; margin: 16px 0 6px; }
    #status { margin: 0 0 8px; }
    #status.error { color: #b00020; font-weight: bold; }
    .legend { margin: 0 0 8px; font-size: 12px; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; }
    .cell { display: flex; flex-direction: column; gap: 2px; font-size: 10px; max-width: 300px; }
    .pair { display: flex; gap: 2px; align-items: flex-start; }
    /* Checkerboard behind each image (shows RGBA transparency), as on the contact sheet. */
    .pair canvas, .pair img {
        display: block;
        image-rendering: pixelated;
        background-color: #7a7a7a;
        background-image:
            linear-gradient(45deg, #5a5a5a 25%, transparent 25%, transparent 75%, #5a5a5a 75%),
            linear-gradient(45deg, #5a5a5a 25%, transparent 25%, transparent 75%, #5a5a5a 75%);
        background-size: 16px 16px;
        background-position: 0 0, 8px 8px;
    }
    .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .error { color: #b00020; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>button-face browser demo</h1>
<p class="legend">Each cell: <b>left</b> = rendered in this browser with <code>browserBackend</code>;
<b>right</b> = Node (<code>napiBackend</code>) PNG from <code>scratch/samples/</code>, shown only if
<code>npm run samples</code> has been run.</p>
<p id="status">Rendering...</p>
<main id="groups"></main>
<script type="module" src="demo.js"></script>
</body>
</html>
